<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NASA 소행성 접근 정보 조회</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b3d91; /* NASA Blue */
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: #111625;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid #1f2942;
    }

    h1 {
      text-align: center;
      margin-bottom: 24px;
      color: #ffffff;
      font-size: 1.8rem;
    }

    .search-box {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    label {
      font-size: 1rem;
      font-weight: 600;
    }

    input[type="date"] {
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #1e293b;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background-color: #fc3d21; /* NASA Red */
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #e02f17;
    }

    .status {
      text-align: center;
      margin: 20px 0;
      font-size: 1.1rem;
      color: #94a3b8;
    }

    .asteroid-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .card {
      background: #1e293b;
      border-radius: 8px;
      padding: 20px;
      border-left: 4px solid #3b82f6;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card.hazardous {
      border-left-color: #ef4444;
      background: #2a1b24;
    }

    .card h3 {
      font-size: 1.2rem;
      color: #f8fafc;
      word-break: break-all;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      width: fit-content;
    }

    .badge-safe {
      background-color: #065f46;
      color: #34d399;
    }

    .badge-danger {
      background-color: #991b1b;
      color: #fca5a5;
    }

    .info-item {
      font-size: 0.95rem;
      color: #cbd5e1;
    }

    .info-item strong {
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🚀 NASA 근지구 소행성(NEO) 정보</h1>
    
    <div class="search-box">
      <label for="date-input">날짜 선택:</label>
      <input type="date" id="date-input">
      <button onclick="fetchAsteroids()">조회하기</button>
    </div>

    <div id="status" class="status">날짜를 선택하고 조회 버튼을 눌러주세요.</div>
    <div id="asteroid-list" class="asteroid-list"></div>
  </div>

  <script>
    const API_KEY = '8BmfdcpVXLRND6L3urBWVP0NjOysegFvCZS4HWT7';
    
    // 페이지 로드 시 오늘 날짜 기본 설정
    document.addEventListener('DOMContentLoaded', () => {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('date-input').value = today;
    });

    async function fetchAsteroids() {
      const dateInput = document.getElementById('date-input').value;
      const statusDiv = document.getElementById('status');
      const listDiv = document.getElementById('asteroid-list');

      if (!dateInput) {
        alert('날짜를 선택해주세요.');
        return;
      }

      statusDiv.textContent = '데이터를 불러오는 중입니다...';
      listDiv.innerHTML = '';

      const url = `https://api.nasa.gov/neo/rest/v1/feed?start_date=${dateInput}&end_date=${dateInput}&api_key=${API_KEY}`;

      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`오류가 발생했습니다: ${response.status}`);
        }

        const data = await response.json();
        const asteroids = data.near_earth_objects[dateInput];

        if (!asteroids || asteroids.length === 0) {
          statusDiv.textContent = '해당 날짜에 접근하는 소행성 데이터가 없습니다.';
          return;
        }

        statusDiv.textContent = `총 ${asteroids.length}개의 소행성이 발견되었습니다.`;

        asteroids.forEach(asteroid => {
          const isHazardous = asteroid.is_potentially_hazardous_asteroid;
          const minDiam = asteroid.estimated_diameter.meters.estimated_diameter_min.toFixed(1);
          const maxDiam = asteroid.estimated_diameter.meters.estimated_diameter_max.toFixed(1);
          
          const closeApproachData = asteroid.close_approach_data[0];
          const speed = parseFloat(closeApproachData.relative_velocity.kilometers_per_hour).toLocaleString('ko-KR', { maximumFractionDigits: 0 });
          const missDistance = parseFloat(closeApproachData.miss_distance.kilometers).toLocaleString('ko-KR', { maximumFractionDigits: 0 });

          const card = document.createElement('div');
          card.className = `card ${isHazardous ? 'hazardous' : ''}`;
          
          card.innerHTML = `
            <h3>${asteroid.name}</h3>
            <div>
              <span class="badge ${isHazardous ? 'badge-danger' : 'badge-safe'}">
                ${isHazardous ? '⚠️ 위협 가능성 있음' : '✅ 안전함'}
              </span>
            </div>
            <div class="info-item"><strong>추정 지름:</strong> ${minDiam}m ~ ${maxDiam}m</div>
            <div class="info-item"><strong>상대 속도:</strong> 시속 ${speed} km</div>
            <div class="info-item"><strong>지구 최단 거리:</strong> ${missDistance} km</div>
          `;

          listDiv.appendChild(card);
        });

      } catch (error) {
        console.error(error);
        statusDiv.textContent = '데이터를 가져오는 중 오류가 발생했습니다. API 키 또는 네트워크 상태를 확인해주세요.';
      }
    }
  </script>
</body>
</html>
